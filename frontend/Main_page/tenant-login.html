<!DOCTYPE html>
<html lang="en">

<head>
	<title>Tenant Login - BENRO Real Estate</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link
		href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,700;0,800;1,200;1,300;1,400;1,500;1,700&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

	<link rel="stylesheet" href="css/animate.css">
	<link rel="stylesheet" href="css/style.css">

	<style>
		/* Login Page Specific Styles */
		body.login-page {
			background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.login-container {
			width: 100%;
			max-width: 450px;
			background: #ffffff;
			border-radius: 15px;
			box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
			overflow: hidden;
			animation: slideInUp 0.5s ease;
		}

		@keyframes slideInUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.login-header {
			background: linear-gradient(135deg, #b7472a 0%, #963a22 100%);
			padding: 40px 30px;
			text-align: center;
			color: #ffffff;
		}

		.login-header h1 {
			margin: 0;
			font-size: 28px;
			font-weight: 700;
			margin-bottom: 10px;
		}

		.login-header .logo-subtitle {
			font-size: 14px;
			opacity: 0.9;
			margin: 0;
		}

		.login-header .logo-icon {
			font-size: 45px;
			margin-bottom: 15px;
			display: inline-block;
		}

		.login-body {
			padding: 40px 30px;
		}

		.login-body h2 {
			color: #2c2c2c;
			font-size: 22px;
			font-weight: 600;
			margin-bottom: 10px;
			text-align: center;
		}

		.login-body .subtitle {
			color: #6c757d;
			text-align: center;
			margin-bottom: 30px;
			font-size: 14px;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			margin-bottom: 8px;
			color: #333;
			font-weight: 600;
			font-size: 14px;
		}

		.form-group input {
			width: 100%;
			padding: 12px 15px;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 14px;
			transition: all 0.3s ease;
			font-family: inherit;
		}

		.form-group input:focus {
			border-color: #b7472a;
			box-shadow: 0 0 0 3px rgba(183, 71, 42, 0.1);
			outline: none;
			background: #fafafa;
		}

		.form-group input::placeholder {
			color: #999;
		}

		.remember-forgot {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 25px;
			font-size: 13px;
		}

		.remember-me {
			display: flex;
			align-items: center;
		}

		.remember-me input[type="checkbox"] {
			width: auto;
			margin-right: 8px;
			cursor: pointer;
		}

		.forgot-password a {
			color: #b7472a;
			text-decoration: none;
			font-weight: 600;
			transition: color 0.3s ease;
		}

		.forgot-password a:hover {
			color: #963a22;
			text-decoration: underline;
		}

		.btn-login {
			width: 100%;
			padding: 13px;
			background: linear-gradient(135deg, #b7472a 0%, #963a22 100%);
			color: #ffffff;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			box-shadow: 0 4px 12px rgba(183, 71, 42, 0.3);
		}

		.btn-login:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(183, 71, 42, 0.4);
		}

		.btn-login:active {
			transform: translateY(0);
		}

		.divider {
			text-align: center;
			margin: 25px 0;
			position: relative;
			color: #999;
			font-size: 13px;
		}

		.divider::before,
		.divider::after {
			content: '';
			position: absolute;
			top: 50%;
			width: 45%;
			height: 1px;
			background: #e0e0e0;
		}

		.divider::before {
			left: 0;
		}

		.divider::after {
			right: 0;
		}

		.signup-link {
			text-align: center;
			margin-top: 20px;
			color: #6c757d;
			font-size: 14px;
		}

		.signup-link a {
			color: #b7472a;
			text-decoration: none;
			font-weight: 600;
			transition: color 0.3s ease;
		}

		.signup-link a:hover {
			color: #963a22;
			text-decoration: underline;
		}

		.login-features {
			display: flex;
			gap: 15px;
			margin-top: 30px;
			padding-top: 25px;
			border-top: 1px solid #e0e0e0;
		}

		.feature {
			flex: 1;
			text-align: center;
			font-size: 13px;
			color: #6c757d;
		}

		.feature i {
			display: block;
			font-size: 24px;
			color: #b7472a;
			margin-bottom: 8px;
		}

		.error-message {
			background: #f8d7da;
			color: #721c24;
			padding: 12px 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			border: 1px solid #f5c6cb;
			display: none;
		}

		.error-message.show {
			display: block;
			animation: slideInDown 0.3s ease;
		}

		@keyframes slideInDown {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.success-message {
			background: #d4edda;
			color: #155724;
			padding: 12px 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			border: 1px solid #c3e6cb;
			display: none;
		}

		.success-message.show {
			display: block;
			animation: slideInDown 0.3s ease;
		}

		.back-to-home {
			text-align: center;
			margin-top: 20px;
		}

		.back-to-home a {
			color: #b7472a;
			text-decoration: none;
			font-size: 13px;
			font-weight: 600;
			transition: color 0.3s ease;
		}

		.back-to-home a:hover {
			color: #963a22;
		}

		/* Responsive Design */
		@media (max-width: 768px) {
			.login-container {
				max-width: 100%;
				max-width: 380px;
			}

			.login-header {
				padding: 30px 20px;
			}

			.login-header h1 {
				font-size: 24px;
			}

			.login-body {
				padding: 30px 20px;
			}

			.login-features {
				flex-wrap: wrap;
			}
		}

		@media (max-width: 480px) {
			.login-container {
				border-radius: 10px;
			}

			.login-header {
				padding: 25px 15px;
			}

			.login-body {
				padding: 25px 15px;
			}

			.login-body h2 {
				font-size: 20px;
			}

			.remember-forgot {
				flex-direction: column;
				align-items: flex-start;
				gap: 10px;
			}
		}
	</style>
</head>

<body class="login-page">

	<div class="login-container ftco-animate">
		<!-- Login Header -->
		<div class="login-header">
			<div class="logo-icon">
				<i class="fa fa-building"></i>
			</div>
			<h1>BENRO</h1>
			<p class="logo-subtitle">Tenant Portal</p>
		</div>

		<!-- Login Body -->
		<div class="login-body">
			<!-- Error Message -->
			<div class="error-message" id="errorMessage"></div>

			<!-- Success Message -->
			<div class="success-message" id="successMessage"></div>

			<h2>Tenant Login</h2>
			<p class="subtitle">Access your account to manage your property</p>

			<!-- Login Form -->
			<form id="loginForm" method="POST" action="#">
				<div class="form-group">
					<label for="email">Email Address or Account Number</label>
					<input type="text" id="email" name="email" placeholder="Enter your email or account number"
						required>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" placeholder="Enter your password" required>
				</div>

				<div class="remember-forgot">
					<label class="remember-me">
						<input type="checkbox" id="rememberMe" name="rememberMe">
						<span>Remember me</span>
					</label>
					<div class="forgot-password">
						<a href="forgot-password.html">Forgot Password?</a>
					</div>
				</div>

				<button type="submit" class="btn-login">
					<span>Sign In</span>
				</button>
			</form>

			<!-- Divider -->
			<div class="divider">OR</div>

			<!-- Additional Options -->
			<div class="signup-link">
				Don't have an account? <a href="tenant-register.html">Register here</a>
			</div>

			<!-- Features -->
			<div class="login-features">
				<div class="feature">
					<i class="fa fa-lock"></i>
					<span>Secure</span>
				</div>
				<div class="feature">
					<i class="fa fa-mobile"></i>
					<span>Mobile Friendly</span>
				</div>
				<div class="feature">
					<i class="fa fa-headphones"></i>
					<span>24/7 Support</span>
				</div>
			</div>

			<!-- Back to Home -->
			<div class="back-to-home">
				<a href="index.html"><i class="fa fa-arrow-left"></i> Back to Home</a>
			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="js/jquery.min.js"></script>
	<script src="js/popper.min.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/scrollax.min.js"></script>

	<script>
		$(document).ready(function() {
			// Form submission
			$('#loginForm').on('submit', function(e) {
				e.preventDefault();

				const email = $('#email').val().trim();
				const password = $('#password').val().trim();
				const rememberMe = $('#rememberMe').is(':checked');

				// Clear previous messages
				$('.error-message').removeClass('show').html('');
				$('.success-message').removeClass('show').html('');

				// Validation
				if (!email) {
					showError('Please enter your email or account number');
					return;
				}

				if (!password) {
					showError('Please enter your password');
					return;
				}

				if (password.length < 6) {
					showError('Password must be at least 6 characters long');
					return;
				}

				// Simulate login process
				$('.btn-login').prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Signing in...');

				// Simulate API call
				setTimeout(function() {
					// Success message
					showSuccess('Login successful! Redirecting...');

					// Save remember me preference
					if (rememberMe) {
						localStorage.setItem('tenantEmail', email);
					} else {
						localStorage.removeItem('tenantEmail');
					}

					// Redirect after delay
					setTimeout(function() {
						window.location.href = 'tenant-dashboard.html';
					}, 1500);
				}, 1500);
			});

			// Load saved email if available
			const savedEmail = localStorage.getItem('tenantEmail');
			if (savedEmail) {
				$('#email').val(savedEmail);
				$('#rememberMe').prop('checked', true);
			}

			// Show error message
			function showError(message) {
				$('#errorMessage').html(message).addClass('show');
			}

			// Show success message
			function showSuccess(message) {
				$('#successMessage').html(message).addClass('show');
			}

			// Clear messages on input
			$('#email, #password').on('input', function() {
				$('.error-message').removeClass('show');
				$('.success-message').removeClass('show');
			});
		});
	</script>

</body>

</html>
